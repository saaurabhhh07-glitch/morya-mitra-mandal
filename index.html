<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>मोरया मित्र मंडळ मानेवाडी | T-Shirt Booking</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:720px;margin:auto;padding:22px}.hero{text-align:center;padding:28px 12px}
h1{color:#f6c34e;font-size:32px;margin:0 0 8px}.sub{font-size:18px;color:#ddd}
.card{background:#151515;border:1px solid #493916;border-radius:26px;padding:24px;margin:18px 0}
.poster{width:100%;border-radius:18px;display:block;background:#222;min-height:180px;object-fit:cover}
.price{text-align:center;font-size:40px;font-weight:800;color:#f6c34e;margin:20px 0 8px}
.deadline{text-align:center;background:#a51f1f;border-radius:14px;padding:16px;font-weight:700;font-size:19px}
h2{color:#f6c34e}label{display:block;font-weight:700;margin:18px 0 8px;font-size:17px}
input,select{width:100%;padding:17px;border-radius:13px;border:1px solid #666;background:#222;color:#fff;font-size:17px}
button{width:100%;padding:17px;border:0;border-radius:14px;background:#f6c34e;color:#111;font-size:18px;font-weight:800;margin-top:22px}
.note{text-align:center;color:#aaa;margin-top:14px}.status{text-align:center;margin-top:15px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <h1>मोरया मित्र मंडळ मानेवाडी</h1>
    <div class="sub">स्थापना २०२५ • गणपती बाप्पा मोरया! 🙏</div>
  </section>

  <section class="card">
    <img class="poster" src="tshirt-poster.png" alt="T-Shirt Poster"
         onerror="this.style.display='none'">
    <div class="price">₹300 / टी-शर्ट</div>
    <div class="deadline">बुकिंगची अंतिम तारीख: २५ ऑगस्ट</div>
  </section>

  <section class="card">
    <h2>👕 T-Shirt Booking</h2>
    <form id="bookingForm">
      <label>तुमचे नाव</label>
      <input id="name" required placeholder="उदा. रोहित पाटील">

      <label>मोबाईल नंबर</label>
      <input id="mobile" required inputmode="numeric" pattern="[0-9]{10}" maxlength="10" placeholder="10 अंकी नंबर">

      <label>साईज</label>
      <select id="size" required>
        <option value="">साईज निवडा</option><option>S</option><option>M</option><option>L</option>
        <option>XL</option><option>XXL</option>
      </select>

      <label>टी-शर्ट संख्या</label>
      <input id="quantity" type="number" min="1" max="20" value="1" required>

      <button id="submitBtn" type="submit">बुकिंग Submit करा</button>
      <div class="status" id="status"></div>
      <div class="note">Submit केल्यानंतर तुमची बुकिंग Admin Dashboard मध्ये थेट जमा होईल.</div>
    </form>
  </section>
</div>
<script>
const form=document.getElementById('bookingForm');
const status=document.getElementById('status');
const btn=document.getElementById('submitBtn');
form.addEventListener('submit',async(e)=>{
  e.preventDefault();
  const mobile=document.getElementById('mobile').value.trim();
  if(!/^[0-9]{10}$/.test(mobile)){status.textContent='कृपया योग्य 10 अंकी मोबाईल नंबर द्या.';return}
  const data={
    name:document.getElementById('name').value.trim(),
    mobile,size:document.getElementById('size').value,
    quantity:Number(document.getElementById('quantity').value)
  };
  btn.disabled=true;btn.textContent='Booking जमा होत आहे...';status.textContent='';
  try{
    const r=await fetch('/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||'Booking failed');
    status.textContent='✅ Booking successfully submitted!';
    form.reset();document.getElementById('quantity').value=1;
  }catch(err){status.textContent='❌ '+err.message}
  finally{btn.disabled=false;btn.textContent='बुकिंग Submit करा'}
});
</script>
</body>
</html>
