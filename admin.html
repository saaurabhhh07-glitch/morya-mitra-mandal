<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | मोरया मित्र मंडळ मानेवाडी</title>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi&family=Yatra+One&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#070605;color:#fff7e8;font-family:"Tiro Devanagari Marathi",serif}.wrap{max-width:1200px;margin:auto;padding:25px 15px 50px}.brand{text-align:center}.brand h1{font:38px "Yatra One";color:#ffe4a0}.card{margin-top:20px;border:1px solid #9d763866;border-radius:24px;background:#17100aeF;padding:24px;box-shadow:0 20px 60px #000b}input{width:100%;padding:14px;background:#0a0806;border:1px solid #765722;border-radius:12px;color:#fff;font:inherit;margin:8px 0}.btn{padding:12px 18px;border:0;border-radius:11px;background:linear-gradient(100deg,#ae741a,#ffe29c,#b87e20);font-weight:bold;cursor:pointer}.danger{background:#5a1711;color:#fff}.top{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:18px;border:1px solid #87652d66;border-radius:16px;background:#0d0906}.stat b{display:block;font-size:28px;color:#ffd979}.tablewrap{overflow:auto;margin-top:18px}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:12px;border-bottom:1px solid #4d3920;text-align:left}th{color:#eecb7e;background:#0d0906}.hidden{display:none}.msg{color:#ffd98a}.sizes{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.pill{padding:8px 12px;border:1px solid #6d5227;border-radius:20px;background:#0c0906}@media(max-width:650px){.stats{grid-template-columns:1fr}.brand h1{font-size:29px}}</style></head>
<body><main class=wrap><div class=brand><h1>मोरया मित्र मंडळ मानेवाडी</h1><p>Admin Dashboard • T-Shirt Booking 2026</p></div>
<section class=card id=login><h2>🔐 Admin Login</h2><input id=u placeholder="Username"><input id=p type=password placeholder="Password"><button class=btn onclick=login()>LOGIN</button><p id=lm class=msg></p></section>
<section class="card hidden" id=dash><div class=top><h2>📊 Booking Dashboard</h2><div><button class=btn onclick=load()>↻ Refresh</button> <button class=btn onclick=csv()>📥 CSV</button> <button class="btn danger" onclick=logout()>Logout</button></div></div>
<div class=stats><div class=stat>Total Bookings<b id=tb>0</b></div><div class=stat>Total T-Shirts<b id=tq>0</b></div><div class=stat>Unique Members<b id=tm>0</b></div></div><div class=sizes id=sz></div>
<input id=search placeholder="🔎 नाव / मोबाईल / Size search..." oninput=render()><div class=tablewrap><table><thead><tr><th>Booking ID</th><th>नाव</th><th>मोबाईल</th><th>Size</th><th>Qty</th><th>Time</th><th>Action</th></tr></thead><tbody id=rows></tbody></table></div></section></main>
<script>
let data=[];
async function login(){let r=await fetch("api.php",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"login",username:u.value,password:p.value})});let j=await r.json();if(j.ok){sessionStorage.token=j.token;login.classList.add("hidden");dash.classList.remove("hidden");load()}else lm.textContent=j.error||"Login failed"}
async function load(){let r=await fetch("api.php?action=list",{headers:{Authorization:sessionStorage.token||""}});let j=await r.json();if(!j.ok){logout();return}data=j.bookings;render()}
function render(){let q=(search.value||"").toLowerCase();let x=data.filter(b=>[b.id,b.name,b.mobile,b.size].join(" ").toLowerCase().includes(q));rows.innerHTML=x.map(b=>`<tr><td>${b.id}</td><td>${esc(b.name)}</td><td>${b.mobile}</td><td>${b.size}</td><td>${b.qty}</td><td>${b.created_at}</td><td><button class="btn danger" onclick="del('${b.id}')">Delete</button></td></tr>`).join("");tb.textContent=data.length;tq.textContent=data.reduce((a,b)=>a+Number(b.qty),0);tm.textContent=new Set(data.map(b=>b.mobile)).size;let c={};data.forEach(b=>c[b.size]=(c[b.size]||0)+Number(b.qty));sz.innerHTML=Object.entries(c).map(([k,v])=>`<span class=pill>${k}: ${v}</span>`).join("")||"<span class=pill>No bookings</span>"}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function del(id){if(!confirm("Delete booking "+id+"?"))return;let r=await fetch("api.php",{method:"POST",headers:{"Content-Type":"application/json",Authorization:sessionStorage.token},body:JSON.stringify({action:"delete",id})});let j=await r.json();if(j.ok)load();else alert(j.error)}
function csv(){let h="Booking ID,Name,Mobile,Size,Quantity,Time\n";let c=h+data.map(b=>[b.id,b.name,b.mobile,b.size,b.qty,b.created_at].map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/csv;charset=utf-8"}));a.download="morya_mitra_mandal_tshirt_bookings.csv";a.click()}
function logout(){sessionStorage.clear();location.reload()}if(sessionStorage.token){login.classList.add("hidden");dash.classList.remove("hidden");load()}
</script></body></html>
